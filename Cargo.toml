[package]
name = "workrus"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A low-dependency CLI for Linear workflows"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Alvin Yip"]
keywords = ["linear", "cli", "issues"]
categories = ["command-line-utilities"]
repository = "https://github.com/keongalvin/workrus-cli"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
libc = "0.2"
atomic-write-file = "0.3.1"

[lints.rust]
unsafe_code = "forbid"
